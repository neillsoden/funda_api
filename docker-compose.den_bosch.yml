# Optional Den Bosch instance. Bring it in alongside the main compose file with:
#   docker compose -f docker-compose.yml -f docker-compose.den_bosch.yml up -d --build
# Shares ./data with the Arnhem instance - safe, since HOUSE_HUNTER_INSTANCE
# gives each instance distinct filenames (config.den_bosch.json etc) within it.
services:
  house_hunter_den_bosch:
    build:
      context: .
      dockerfile: Dockerfile.house_hunter
    environment:
      - HOUSE_HUNTER_INSTANCE=den_bosch
      - HOUSE_HUNTER_DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  house_hunter_den_bosch_webapp:
    build:
      context: .
      dockerfile: Dockerfile.house_hunter
    command: ["python", "house_hunter/webapp/app.py"]
    environment:
      - HOUSE_HUNTER_INSTANCE=den_bosch
      - HOUSE_HUNTER_DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "5011:5000"
    restart: unless-stopped
