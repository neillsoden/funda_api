<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}House Hunter{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --indigo: #4f46e5;
      --indigo-dark: #4338ca;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-500: #64748b;
      --slate-700: #334155;
      --slate-900: #0f172a;
      --red: #dc2626;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
    }
    a { color: var(--indigo); }
    .nav {
      background: #ffffff;
      border-bottom: 1px solid var(--slate-200);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .nav .brand {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--slate-900);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    .nav .links { display: flex; align-items: center; gap: 18px; font-size: 0.9rem; }
    .nav .links a { color: var(--slate-700); text-decoration: none; font-weight: 500; }
    .nav .links a:hover { color: var(--indigo); }
    .nav .who { color: var(--slate-500); font-size: 0.85rem; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px 20px; }
    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 4px 0; }
    h2 { font-size: 1.05rem; font-weight: 700; margin-top: 2rem; padding-bottom: 8px; border-bottom: 1px solid var(--slate-200); }
    .hint { font-size: 0.85rem; color: var(--slate-500); margin-top: 2px; }
    .card { background: #ffffff; border: 1px solid var(--slate-200); border-radius: 14px; box-shadow: 0 1px 2px rgba(15,23,42,0.04); padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--slate-700); margin-top: 14px; margin-bottom: 6px; }
    input[type=text], input[type=number], input[type=password], select, textarea {
      width: 100%; padding: 10px 12px; box-sizing: border-box; font-size: 0.95rem;
      border: 1px solid var(--slate-200); border-radius: 8px; background: #fff;
      font-family: inherit; color: var(--slate-900);
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }
    .row { display: flex; gap: 16px; }
    .row > div { flex: 1; }
    button, .btn {
      display: inline-block; margin-top: 18px; padding: 10px 18px; font-size: 0.9rem; font-weight: 600;
      border-radius: 8px; border: 1px solid var(--indigo); background: var(--indigo); color: #fff; cursor: pointer;
      text-decoration: none;
    }
    button:hover, .btn:hover { background: var(--indigo-dark); border-color: var(--indigo-dark); }
    .btn-secondary { background: #fff; color: var(--slate-700); border-color: var(--slate-200); }
    .btn-secondary:hover { background: var(--slate-100); color: var(--slate-900); }
    .btn-remove { background: #fff; color: var(--red); border-color: #fecaca; padding: 4px 10px; font-size: 0.8rem; margin-top: 0; }
    .errors { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); padding: 12px 14px; border-radius: 10px; margin-top: 16px; font-size: 0.9rem; }
    .saved { color: var(--green); font-size: 0.9rem; font-weight: 600; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% if session.get('user') %}
  <div class="nav">
    <a class="brand" href="/">🏡 House Hunter</a>
    <div class="links">
      <a href="/">Preferences</a>
      <a href="/favorites">Favorites</a>
      <a href="/rejected">Not interested</a>
      <span class="who">{{ session.user|capitalize }} &middot; <a href="/logout">Log out</a></span>
    </div>
  </div>
  {% endif %}
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
