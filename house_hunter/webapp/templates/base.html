<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}House Hunter{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #FF2D20;
      --red-dark: #E0271C;
      --red-tint: #fef2f1;
      --ink: #17161A;
      --gray-50: #fafafa;
      --gray-100: #f5f5f4;
      --gray-200: #e5e7eb;
      --gray-500: #78716c;
      --gray-600: #57534e;
      --green: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--gray-50);
      color: var(--ink);
    }
    a { color: var(--red); }
    .nav {
      background: #ffffff;
      border-bottom: 1px solid var(--gray-200);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav .brand {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav .links { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; }
    .nav .links a { color: var(--gray-600); text-decoration: none; font-weight: 600; padding: 8px 14px; border-radius: 999px; transition: background .15s, color .15s; }
    .nav .links a:hover { background: var(--gray-100); color: var(--ink); }
    .nav .who { color: var(--gray-500); font-size: 0.85rem; margin-left: 6px; padding-left: 14px; border-left: 1px solid var(--gray-200); }
    .nav .who a { padding: 0; color: var(--red); font-weight: 600; }
    .nav .who a:hover { background: none; text-decoration: underline; }
    .hamburger { display: none; margin: 0; padding: 6px; height: auto; background: none; border: none;
      box-shadow: none; color: var(--ink); cursor: pointer; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px 20px; }
    h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px 0; }
    h2 { font-size: 1.05rem; font-weight: 700; margin-top: 2.2rem; padding-bottom: 10px; border-bottom: 1px solid var(--gray-200); }
    .hint { font-size: 0.85rem; color: var(--gray-500); margin-top: 2px; }
    .card { background: #ffffff; border: 1px solid var(--gray-200); border-radius: 18px; box-shadow: 0 1px 2px rgba(23,22,26,0.03); padding: 22px; margin-bottom: 16px; }
    label { display: block; font-size: 0.76rem; font-weight: 700; color: var(--ink); margin-top: 14px; margin-bottom: 5px; }
    input[type=text], input[type=number], input[type=password], select, textarea {
      width: 100%; height: 38px; padding: 0 12px; box-sizing: border-box; font-size: 0.88rem;
      border: 1.5px solid var(--gray-200); border-radius: 9px; background: var(--gray-50);
      font-family: inherit; color: var(--ink); transition: border-color .15s, background .15s;
      -moz-appearance: textfield; appearance: none;
    }
    textarea { height: auto; padding: 10px 12px; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='%2378716c'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--red); background: #fff; box-shadow: 0 0 0 4px rgba(255,45,32,0.10);
    }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 140px; }
    button, .btn {
      display: inline-block; margin-top: 20px; height: 38px; padding: 0 20px; font-size: 0.85rem; font-weight: 700;
      border-radius: 999px; border: none; background: var(--red); color: #fff; cursor: pointer;
      text-decoration: none; box-shadow: 0 6px 16px rgba(255,45,32,0.25); transition: background .15s, transform .1s;
      line-height: 38px;
    }
    button:hover, .btn:hover { background: var(--red-dark); }
    button:active, .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #fff; color: var(--ink); border: 1.5px solid var(--gray-200); box-shadow: none; }
    .btn-secondary:hover { background: var(--gray-100); }
    .btn-remove { background: #fff; color: var(--red); border: 1.5px solid #ffd4cf; padding: 5px 12px; font-size: 0.8rem; margin-top: 0; box-shadow: none; }
    .btn-remove:hover { background: var(--red-tint); }
    .errors { background: var(--red-tint); border: 1px solid #ffd4cf; color: var(--red-dark); padding: 12px 16px; border-radius: 14px; margin-top: 16px; font-size: 0.9rem; font-weight: 600; }
    .saved { color: var(--green); font-size: 0.9rem; font-weight: 700; }
    @media (max-width: 600px) {
      .nav { padding: 10px 14px; gap: 6px; }
      .nav .brand { font-size: 0.95rem; }
      .hamburger { display: block; }
      .nav .links {
        display: none; flex-direction: column; align-items: stretch; gap: 2px; font-size: 0.85rem;
        flex-basis: 100%; width: 100%; order: 3;
      }
      .nav .links.open { display: flex; }
      .nav .links a { padding: 10px 8px; border-radius: 8px; }
      .nav .who {
        flex-shrink: 0; white-space: nowrap; margin: 6px 0 0 0; padding: 10px 8px 0 8px;
        border-left: none; border-top: 1px solid var(--gray-200);
      }
      .wrap { padding: 24px 14px 40px 14px; }
      h1 { font-size: 1.4rem; }
      .card { padding: 16px; border-radius: 14px; }
      .row { gap: 10px; }
      .row > div { min-width: 100%; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% if session.get('user') %}
  <div class="nav">
    <a class="brand" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-4px;margin-right:6px;"><path d="M10 20v-6h4v6h5v-8h3L12 3L2 12h3v8z"/></svg>House Hunter</a>
    <button type="button" class="hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <div class="links" id="navLinks">
      <a href="/">Preferences</a>
      <a href="/houses">Houses</a>
      <a href="/favorites">Favorites</a>
      <a href="/rejected">Not interested</a>
      <a href="/onder-bod">Onder bod</a>
      <a href="/schools">Schools</a>
      <a href="/logs">Logs</a>
      <span class="who">{{ session.user|capitalize }} &middot; <a href="/logout">Log out</a></span>
    </div>
  </div>
  {% endif %}
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
