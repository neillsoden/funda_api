<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — House Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --indigo: #4f46e5;
      --indigo-dark: #4338ca;
      --slate-50: #f8fafc;
      --slate-200: #e2e8f0;
      --slate-500: #64748b;
      --slate-700: #334155;
      --slate-900: #0f172a;
      --red: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(180deg, #eef2ff 0%, var(--slate-50) 320px);
      color: var(--slate-900);
    }
    .box { width: 100%; max-width: 380px; padding: 24px; }
    .logo { text-align: center; font-size: 1.6rem; margin-bottom: 6px; }
    .brand { text-align: center; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; margin-bottom: 28px; color: var(--slate-900); }
    .card { background: #fff; border: 1px solid var(--slate-200); border-radius: 16px; box-shadow: 0 4px 16px rgba(15,23,42,0.06); padding: 28px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--slate-700); margin-bottom: 6px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 11px 12px; font-size: 0.95rem; border: 1px solid var(--slate-200);
      border-radius: 8px; margin-bottom: 16px; font-family: inherit; color: var(--slate-900);
    }
    input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(79,70,229,0.15); }
    button {
      width: 100%; padding: 11px; font-size: 0.95rem; font-weight: 700; border-radius: 8px;
      border: 1px solid var(--indigo); background: var(--indigo); color: #fff; cursor: pointer; margin-top: 4px;
    }
    button:hover { background: var(--indigo-dark); }
    .error { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); padding: 10px 12px;
      border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
    .footer-hint { text-align: center; color: var(--slate-500); font-size: 0.8rem; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🏡</div>
    <div class="brand">House Hunter</div>
    <div class="card">
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="next" value="{{ next or '' }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
    </div>
    <div class="footer-hint">Private household tool — not for public sign-up.</div>
  </div>
</body>
</html>
