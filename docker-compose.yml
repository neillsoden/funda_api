services:
  house_hunter_arnhem:
    build:
      context: .
      dockerfile: Dockerfile.house_hunter
    environment:
      - HOUSE_HUNTER_DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  house_hunter_arnhem_webapp:
    build:
      context: .
      dockerfile: Dockerfile.house_hunter
    command: ["python", "house_hunter/webapp/app.py"]
    environment:
      - HOUSE_HUNTER_DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    ports:
      - "5010:5000"
    restart: unless-stopped
