services:
  house_hunter_arnhem:
    build:
      context: .
      dockerfile: Dockerfile.house_hunter
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
      - ./state.sqlite:/app/state.sqlite
    restart: unless-stopped

  house_hunter_arnhem_webapp:
    build:
      context: .
      dockerfile: Dockerfile.house_hunter
    command: ["python", "house_hunter/webapp/app.py"]
    env_file:
      - .env
    volumes:
      - ./config.json:/app/config.json
    ports:
      - "5010:5000"
    restart: unless-stopped
